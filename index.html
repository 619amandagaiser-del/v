<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>startv</title>
    <link rel="icon" type="image/x-icon" href="/uploads/branding/favicon.png" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        position: relative;
        overflow-x: hidden;
        background: #0d0d14;
        font-family: Arial, sans-serif;
      }

      .content-wrapper {
        width: 100%;
        max-width: 960px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .auth-container {
        width: 100%;
        max-width: 480px;
        background: rgba(28, 29, 41, 0.7);
        padding: 20px;
        border-radius: 14px;
        box-shadow: 0 0 12px rgba(138, 43, 226, 0.4);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
      }

      .auth-container input {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: none;
        background: rgba(18, 18, 28, 0.8);
        color: #eee;
      }

      .auth-container button {
        padding: 10px;
        border-radius: 8px;
        border: none;
        background: #8a2be2;
        color: white;
        font-weight: bold;
        cursor: pointer;
      }

      .auth-container button:hover {
        background: #9b4dca;
      }

      .search-container {
        width: 100%;
        max-width: 480px;
        z-index: 10;
        position: relative;
      }

      input[type='search'] {
        width: 100%;
        padding: 14px 20px;
        font-size: 1.1rem;
        border-radius: 12px;
        border: none;
        outline: none;
        background: rgba(28, 29, 41, 0.8);
        color: #eee;
        box-shadow: 0 0 12px rgba(138, 43, 226, 0.6);
      }

      #results {
        width: 100%;
        max-height: 500px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 18px;
        margin-bottom: 30px;
        padding: 16px;
        background: rgba(18, 18, 28, 0.6);
        border-radius: 16px;
        border: 1px solid rgba(138, 43, 226, 0.25);
      }
      #results.hidden {
        opacity: 0;
        pointer-events: none;
        height: 0;
        margin: 0;
        overflow: hidden;
      }

      .video-card {
        display: flex;
        align-items: center;
        width: 100%;
        padding: 10px;
        cursor: pointer;
        background: rgba(28, 29, 41, 0.7);
        border-radius: 14px;
        color: #eee;
      }

      #player {
        width: 100%;
        max-width: 640px;
        aspect-ratio: 16 / 9;
        border-radius: 14px;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <div class="content-wrapper">
      
      <div class="auth-container" id="authBox">
        <h3 style="color: #fff; margin: 0;">Firebase Account Login</h3>
        <input type="email" id="emailInput" placeholder="Email address" />
        <input type="password" id="passwordInput" placeholder="Password" />
        <div style="display: flex; gap: 10px;">
          <button id="loginBtn" style="flex: 1;">Login</button>
          <button id="registerBtn" style="flex: 1; background: #444;">Register</button>
        </div>
        <p id="authStatus" style="color: #bbb; font-size: 0.9rem; margin: 0;"></p>
      </div>

      <div class="search-container">
        <input
          type="search"
          id="searchInput"
          placeholder="Search for videos on YouTube..."
          autocomplete="off"
        />
      </div>
      <div id="results" class="hidden"></div>
      <div id="player">
        <p>Search and click a video to start watching.</p>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";
      import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyC3Uh6bmQDRaDDdTqzmyp2AAzmL9RtA6Hg",
        authDomain: "yoxf-84fd2.firebaseapp.com",
        projectId: "yoxf-84fd2",
        storageBucket: "yoxf-84fd2.firebasestorage.app",
        messagingSenderId: "839850772098",
        appId: "1:839850772098:web:6c393411c77478770a169b",
        measurementId: "G-3GPK7EKLH0"
      };

      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
      const auth = getAuth(app);

      const emailInput = document.getElementById('emailInput');
      const passwordInput = document.getElementById('passwordInput');
      const authStatus = document.getElementById('authStatus');

      // Login functionality
      document.getElementById('loginBtn').addEventListener('click', async () => {
        try {
          const userCredential = await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
          authStatus.style.color = '#76ff03';
          authStatus.textContent = `Logged in: ${userCredential.user.email}`;
        } catch (error) {
          authStatus.style.color = '#ff5252';
          authStatus.textContent = error.message;
        }
      });

      // Register functionality
      document.getElementById('registerBtn').addEventListener('click', async () => {
        try {
          const userCredential = await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
          authStatus.style.color = '#76ff03';
          authStatus.textContent = `Account created successfully!`;
        } catch (error) {
          authStatus.style.color = '#ff5252';
          authStatus.textContent = error.message;
        }
      });
    </script>
    
    <script src="/javascript/tv.js" type="module"></script>
  </body>
</html>
